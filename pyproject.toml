[project]
name = "legion"
version = "0.1.0"
description = "A local, offline voice assistant built on faster-whisper, Ollama, and Piper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.0",
    "faster-whisper>=1.1",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "ollama>=0.4",
    "openwakeword>=0.6.0",
    "piper-tts>=1.3",
    "sounddevice>=0.5",
]

[project.scripts]
legion = "legion.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
